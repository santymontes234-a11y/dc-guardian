; DC Guardian — firmware de la puerta (ESP32 + RC522 + HC-SR04 + servo)
;
;   pio run -e esp32dev                 compilar
;   pio run -e esp32dev -t upload       flashear
;   pio device monitor                  consola serie (115200)
;   pio test -e native                  pruebas unitarias en el PC (sin hardware)
;
; Antes de compilar: copiar include/dcg_config.example.h a include/dcg_config.h y rellenarlo.

[platformio]
default_envs = esp32dev

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
lib_deps_core =
    bblanchon/ArduinoJson@7.2.1

[env:esp32dev]
platform = platformio/espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps =
    ${common.lib_deps_core}
    miguelbalboa/MFRC522@1.4.11
    madhephaestus/ESP32Servo@3.0.6

; Igual que esp32dev, pero con la consola serie de banco (comandos uid/dist).
; NUNCA usar en una puerta real: permite inyectar lecturas falsas.
[env:esp32dev-bench]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DDCG_BENCH_MODE=1

; Firmware de diagnóstico: prueba cada componente por separado (sin red ni lógica de acceso).
; Puede mover el servo por comando serie: solo en banco, con el servo desacoplado.
[env:esp32dev-diag]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DDCG_DIAG=1

; Pruebas unitarias de la lógica pura (lib/dcg_core) en el PC.
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = ${common.build_flags} -DDCG_NATIVE=1 -g
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps_core}
