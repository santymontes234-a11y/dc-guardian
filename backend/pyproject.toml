[project]
name = "dc-guardian"
version = "0.2.0"
description = "Sistema académico de control de acceso inteligente para un Data Center"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Se instala en la Fase 4 (vision-agent).
vision = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    "insightface>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
