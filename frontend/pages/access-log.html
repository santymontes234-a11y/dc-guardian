<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora de accesos · Telecom Conecta · DC Guardian</title>
</head>
<body data-page="access">
  <main id="content">
    <h1>Bitácora de accesos</h1>
    <p class="muted" style="margin-top:-8px">Entrada principal (código QR) y sala de servidores (tarjeta RFID + rostro).</p>
    <section class="card">
      <div class="row" style="margin-bottom:12px">
        <label class="sr-only" for="zone">Zona</label>
        <select id="zone">
          <option value="">Todas las zonas</option>
          <option value="ENTRADA_PRINCIPAL">Entrada principal (QR)</option>
          <option value="SALA_SERVIDORES">Sala de servidores (RFID + rostro)</option>
        </select>
        <label class="sr-only" for="result">Resultado</label>
        <select id="result"><option value="">Todos los resultados</option><option value="GRANTED">Permitidos</option>
          <option value="DENIED">Denegados</option></select>
        <label class="sr-only" for="method">Método</label>
        <select id="method"><option value="">Todos los métodos</option><option value="QR">Código QR</option>
          <option value="RFID+ROSTRO">RFID + rostro</option><option value="BOTON_SALIDA">Botón de salida</option></select>
        <span class="spacer"></span><span class="muted" id="total" aria-live="polite"></span>
        <button class="btn" id="more">Cargar más</button>
      </div>
      <p class="muted" id="legacy-note" hidden>El servidor todavía no expone la bitácora unificada:
        se muestran solo los accesos de la sala de servidores.</p>
      <div class="table-wrap"><table class="table"><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="/js/pages/access-log.js"></script>
</body>
</html>
